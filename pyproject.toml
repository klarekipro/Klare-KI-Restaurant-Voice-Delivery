[project]
name = "klare-ki-restaurant-mvp"
version = "0.1.0"
description = "AI phone-ordering assistant MVP (restaurant, Germany)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
