{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="card error-card">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  {% if detail %}<p class="muted small">{{ detail }}</p>{% endif %}
  <p><a class="primary" href="{{ cta_href }}">{{ cta_label }}</a></p>
</section>
{% endblock %}
